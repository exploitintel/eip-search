name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ""
          label_trigger: ""
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repository is the human CLI client for the public read-only
            EIP v3 API. It must not connect to PostgreSQL or corpus storage,
            call a model, acquire or execute PoC code, build labs, or write EIP
            state. Review the diff as an API client and hostile-terminal-data
            boundary.

            Review for significant correctness and security findings only:
            - filters, sorts, identifiers, and opaque cursors whose CLI behavior
              differs from the public API;
            - page-local filtering, re-sorting, ranking, or judgments derived
              from stars, Metasploit rank, ExploitDB verification, or model output;
            - claims that an exploit or lab works, is verified, reliable,
              effective, or safe;
            - absent or partial stored analysis rendering as benign;
            - corpus text escaping Rich markup or injecting ANSI/OSC terminal
              control sequences;
            - PoC access tokens reaching output, logs, tracebacks, configuration,
              or retained state;
            - unsafe archive extraction, filename handling, overwrite behavior,
              redirects, response bounds, or partial-file cleanup;
            - stdout contamination in JSON mode, fabricated fields, swallowed
              API errors, or misleading empty results when code search is down;
            - unbounded pagination, concurrency, retries, or output; and
            - scope creep into offline databases, acquisition, generation, or writes.

            Use `gh pr comment` for top-level feedback. Use
            `mcp__github_inline_comment__create_inline_comment` with
            `confirmed: true` for specific line-level issues. Post GitHub
            comments only.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
