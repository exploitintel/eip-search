[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eip-search"
version = "3.0.0"
description = "First-class CLI client for the Exploit Intelligence Platform v3 API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Exploit Intel" }]
keywords = ["cve", "exploit", "security", "stix", "vulnerability-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28,<1",
    "rich>=13,<15",
    "shellingham>=1.5,<2",
    "typer>=0.18,<1",
]

[project.urls]
Homepage = "https://exploit-intel.com"
Documentation = "https://github.com/exploitintel/eip-search/blob/main/docs/user-guide.md"
Issues = "https://github.com/exploitintel/eip-search/issues"
Source = "https://github.com/exploitintel/eip-search"

[project.scripts]
eip-search = "eip_search_v3.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
# Report an override that names a module mypy never processes, so a renamed or
# deleted entry cannot linger. mypy prints that as a note and still exits 0, so
# the CI step greps for it and fails. Note the limit: this does NOT catch a
# module whose errors were fixed but whose exemption stayed, because the module
# still exists and is still processed.
warn_unused_configs = true

# Type checking is a ratchet, not an allowlist. Everything is checked by default
# and the exemptions are listed, never the inverse. Listing what IS checked would
# leave every new module unchecked by default, so debt would accumulate silently
# and the list would be the same size in a year. This way new code is checked
# without anyone deciding to check it, and the list below can only shrink.
#
# 7 of 14 modules are exempt, holding 22 errors: cli, client, config, render.common, render.exploit, render.labs, render.vulnerability.
# Most are one shape: a corpus lookup that may return None, then read with .get
# in the renderers. Fixing that properly means giving the lookup a precise return
# type, which is worth doing deliberately rather than inside a tooling change.
# Removing a module from this list plus fixing its errors is the unit of progress.
[[tool.mypy.overrides]]
module = [
    "eip_search_v3.cli",
    "eip_search_v3.client",
    "eip_search_v3.config",
    "eip_search_v3.render.common",
    "eip_search_v3.render.exploit",
    "eip_search_v3.render.labs",
    "eip_search_v3.render.vulnerability",
]
ignore_errors = true

[tool.ruff]
# Pin the formatter to the version CI installs. `ruff check` findings are stable
# across releases; `ruff format` output is not, and AGENTS.md tells a maintainer
# to run these commands directly, so whatever ruff is on PATH would be used.
# ruff refuses to run on a mismatch rather than producing a different diff.
required-version = "==0.16.3"

line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: bounded checks against an explicitly configured review API"]
