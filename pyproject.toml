[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eip-search"
version = "3.0.0"
description = "First-class CLI client for the Exploit Intelligence Platform v3 API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Exploit Intel" }]
keywords = ["cve", "exploit", "security", "stix", "vulnerability-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28,<1",
    "rich>=13,<15",
    "shellingham>=1.5,<2",
    "typer>=0.18,<1",
]

[project.urls]
Homepage = "https://exploit-intel.com"
Documentation = "https://github.com/exploitintel/eip-search/blob/main/docs/user-guide.md"
Issues = "https://github.com/exploitintel/eip-search/issues"
Source = "https://github.com/exploitintel/eip-search"

[project.scripts]
eip-search = "eip_search_v3.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: bounded checks against an explicitly configured review API"]
